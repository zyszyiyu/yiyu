<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自动延迟跳转</title>
    <!-- 可选：添加简单提示文字样式 -->
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            font-family: Arial, sans-serif;
            color: #333;
        }
    </style>
</head>
<body>
    <!-- 可选：显示跳转提示（可删除） -->
    <div>即将跳转，请稍候...</div>

    <script>
        // 目标跳转网址（替换为你需要的地址）
        const targetUrl = 'https://papaya-fenglisu-d4a5e9.netlify.app/';
        
        // 页面加载后延迟0.1秒（100毫秒）自动跳转
        setTimeout(() => {
            window.location.href = targetUrl;
        }, 100);
    </script>
</body>
</html>
